<section id="stack" class="relative mx-auto max-w-7xl px-5 sm:px-8 py-24 md:py-36"
         data-testid="stack-section">
  <!-- Cabeçalho com animação de entrada -->
  <div class="space-y-4 animate-fade-up">
    <span class="eyebrow">{{ t.eyebrow }}</span>
    <h2 class="font-display text-3xl sm:text-5xl font-bold tracking-tight text-chrome">{{ t.title }}</h2>
    <p class="text-[var(--muted)] text-base sm:text-lg max-w-2xl">{{ t.sub }}</p>
  </div>

  <!-- Grid de Cards com animação escalonada via delay -->
  <div class="mt-16 grid grid-cols-1 gap-5 lg:grid-cols-12">
    @for (g of STACK; track g.key; let i = $index) {
      <div [class]="SPAN[i] + ' h-full animate-fade-up'" [style.animation-delay]="(0.15 * (i % 3)) + 's'">
        <app-stack-card [group]="g" [label]="t.groups[g.key]" [index]="i" />
      </div>
    }
  </div>
</section>
