<section id="journey" class="relative mx-auto max-w-7xl px-5 sm:px-8 py-24 md:py-36" data-testid="journey-section">
  <!-- Cabeçalho com animação de subida -->
  <div class="animate-fade-up">
    <app-section-head [eyebrow]="t.eyebrow" [title]="t.title"></app-section-head>
  </div>

  <div class="relative mt-16 border-l border-[var(--line)] pl-8 sm:pl-12">
    @for (it of t.items; track it.title; let i = $index) {
      <div class="animate-fade-up" [style.animation-delay]="(i * 0.15) + 's'">
        <app-reveal [delay]="i * 0.08">
          <div class="group relative pb-14 last:pb-0" [attr.data-testid]="'journey-item-' + i">
            <span class="absolute -left-[41px] sm:-left-[57px] top-1.5 grid h-5 w-5 place-items-center rounded-full border border-[var(--cyan)] bg-[var(--ink)]">
              <span class="h-2 w-2 rounded-full bg-[var(--cyan)] shadow-[0_0_10px_#4FD8FF] blink"></span>
            </span>

            <p class="eyebrow">{{ it.period }}</p>
            <h3 class="font-display mt-3 text-2xl sm:text-3xl font-bold tracking-tight transition-colors duration-300 group-hover:text-[var(--cyan)]">
              {{ it.title }}
            </h3>
            <p class="mt-3 max-w-2xl leading-relaxed text-[var(--muted)]">
              {{ it.text }}
            </p>
          </div>
        </app-reveal>
      </div>
    }
  </div>
</section>
