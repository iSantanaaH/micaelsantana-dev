<header
  [ngClass]="scrolled() ? 'border-b border-slate-800 bg-slate-950/80 backdrop-blur-xl' : 'border-b border-transparent'"
  class="fixed inset-x-0 top-0 z-50 transition-[background-color,border-color] duration-500">

  <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-5 sm:px-8">

    <!-- Logo -->
    <a href="#top" class="flex items-center gap-3">
      <img src="/logo.jpg" alt="Micael Santana"
           class="h-10 w-10 rounded-xl object-cover ring-1 ring-slate-800" />
      <span class="font-display text-lg font-bold tracking-tight text-white">
        Micael<span class="text-cyan-400">.dev</span>
      </span>
    </a>

    <!-- Desktop Nav -->
    <nav class="hidden items-center gap-8 md:flex">
      <a href="#about" class="text-sm font-medium text-slate-400 transition-colors duration-300 hover:text-cyan-400">{{ t.nav.about }}</a>
      <a href="#stack" class="text-sm font-medium text-slate-400 transition-colors duration-300 hover:text-cyan-400">{{ t.nav.stack }}</a>
      <a href="#project" class="text-sm font-medium text-slate-400 transition-colors duration-300 hover:text-cyan-400">{{ t.nav.project }}</a>
      <a href="#journey" class="text-sm font-medium text-slate-400 transition-colors duration-300 hover:text-cyan-400">{{ t.nav.journey }}</a>
      <a href="#contact" class="text-sm font-medium text-slate-400 transition-colors duration-300 hover:text-cyan-400">{{ t.nav.contact }}</a>
    </nav>

    <!-- Right Actions -->
    <div class="flex items-center gap-3">

      <!-- Lang Toggle -->
      <div class="inline-flex rounded-full border border-slate-800 bg-slate-900 p-1">
        @for (l of ['pt', 'en']; track l) {
          <button (click)="setLang(l)"
                  [ngClass]="lang() === l ? 'bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950' : 'text-slate-400 hover:text-white'"
                  class="rounded-full px-3 py-1.5 font-mono text-xs font-bold uppercase transition-colors duration-300">
            {{ l }}
          </button>
        }
      </div>

      <!-- Mobile Toggle -->
      <button
        class="md:hidden rounded-full border border-slate-800 p-2 text-white flex items-center justify-center bg-slate-900"
        (click)="toggleMenu()"
        aria-label="menu">
        @if (open()) {
          <svg lucideX class="text-white w-5 h-5" [size]="18"></svg>
        } @else {
          <svg lucideMenu class="text-white w-5 h-5" [size]="18"></svg>
        }
      </button>

    </div>
  </div>

  <!-- Mobile Menu -->
  @if (open()) {
    <nav class="panel mx-5 mb-4 flex flex-col rounded-2xl p-4 md:hidden bg-slate-900 border border-slate-800 shadow-xl">
      <a href="#about" (click)="toggleMenu()" class="py-3 font-display text-lg text-white hover:text-cyan-400 transition-colors">{{ t.nav.about }}</a>
      <a href="#stack" (click)="toggleMenu()" class="py-3 font-display text-lg text-white hover:text-cyan-400 transition-colors">{{ t.nav.stack }}</a>
      <a href="#project" (click)="toggleMenu()" class="py-3 font-display text-lg text-white hover:text-cyan-400 transition-colors">{{ t.nav.project }}</a>
      <a href="#journey" (click)="toggleMenu()" class="py-3 font-display text-lg text-white hover:text-cyan-400 transition-colors">{{ t.nav.journey }}</a>
      <a href="#contact" (click)="toggleMenu()" class="py-3 font-display text-lg text-white hover:text-cyan-400 transition-colors">{{ t.nav.contact }}</a>
    </nav>
  }
</header>
