<section id="contact" class="relative px-4 py-24 md:py-32" data-testid="contact-section">
  <div class="relative mx-auto max-w-7xl overflow-hidden rounded-[36px] border border-[var(--line)] bg-[#06163F] px-6 py-16 sm:px-14 md:py-24">
    <app-circuit class="opacity-70"></app-circuit>

    <div class="absolute -bottom-40 left-1/2 h-[420px] w-[720px] -translate-x-1/2 rounded-full bg-[var(--blue)] opacity-40 blur-[120px]"></div>

    <div class="relative grid grid-cols-1 gap-12 lg:grid-cols-12">

      <!-- Coluna Esquerda com animação de subida -->
      <div class="lg:col-span-6 animate-fade-up">
        <p class="eyebrow">{{ t.eyebrow }}</p>

        <app-split-title [lines]="t.title" [glowLast]="true" class="mt-6 text-4xl sm:text-5xl lg:text-6xl font-extrabold"></app-split-title>

        <p class="mt-6 max-w-md text-base md:text-lg text-[var(--muted)]">{{ t.sub }}</p>

        <p class="eyebrow mt-10 !text-[var(--muted)]">{{ t.direct }}</p>

        <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
          @for (social of SOCIALS; track social[0]; let i = $index) {
            <a [href]="social[1]" target="_blank" rel="noopener noreferrer"
               [attr.data-testid]="'contact-link-' + social[0]"
               class="group flex items-center gap-3 rounded-2xl border border-[var(--line)] bg-[var(--ink)]/60 px-4 py-3 transition-colors duration-300 hover:border-[var(--cyan)]">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-[var(--blue)]/20 text-[var(--cyan)]">
                @switch (social[0]) {
                  @case ('whatsapp') {
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                  }
                  @case ('github') {
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
                  }
                  @case ('linkedin') {
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
                  }
                  @case ('email') {
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                  }
                }
              </span>
              <span class="min-w-0 break-all text-sm transition-colors duration-300 group-hover:text-[var(--cyan)]">
                {{ social[2] }}
              </span>
            </a>
          }
        </div>
      </div>

      <!-- Coluna Direita (Formulário) com animação de subida e delay -->
      <div class="lg:col-span-6 animate-fade-up" style="animation-delay: 0.2s;">
        <app-contact-form [c]="t"></app-contact-form>
      </div>

    </div>
  </div>
</section>
